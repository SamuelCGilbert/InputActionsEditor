# Builds the packages of this unofficial fork (.deb, .rpm, AppImage, tarball).
# Pushing a tag such as v0.9.0-wayland.1 builds them and publishes a release.
# Running it by hand from the Actions tab only builds them.
name: Release

on:
  push:
    tags:
      - 'v*-wayland*'
  workflow_dispatch:

jobs:
  build:
    name: Build packages
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    steps:
      - uses: actions/checkout@v6

      - name: Build
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            export VERSION="${GITHUB_REF_NAME#v}"
          fi
          packaging/wayland-fork/build.sh

      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: packaging/out/*

  release:
    name: Publish release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: packages

      - name: Create the release and upload the packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --verify-tag --title "Input Actions Editor with gesture exceptions ${TAG#v}" \
              --notes "Packages of this unofficial fork. See the README for what it adds and how to install it."
          gh release upload "$TAG" input-actions-editor* SHA256SUMS --clobber
